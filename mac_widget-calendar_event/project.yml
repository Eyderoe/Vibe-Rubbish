name: MonthAgenda
options:
  bundleIdPrefix: com.eyderoe
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: YVX76Q5JH2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
targets:
  MonthAgenda:
    type: application
    platform: macOS
    sources:
      - path: MonthAgendaApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyderoe.MonthAgenda
        PRODUCT_NAME: MonthAgenda
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 月历日程
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 用于在桌面小组件中显示你的近期日程。
        INFOPLIST_KEY_NSCalendarsUsageDescription: 用于在桌面小组件中显示你的近期日程。
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: 用于在桌面小组件中显示已安排日期的提醒事项。
        INFOPLIST_KEY_NSRemindersUsageDescription: 用于在桌面小组件中显示已安排日期的提醒事项。
        CODE_SIGN_ENTITLEMENTS: MonthAgendaApp/MonthAgenda.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: MonthAgendaApp/Info.plist
      properties:
        CFBundleDisplayName: 月历日程
        NSCalendarsFullAccessUsageDescription: 用于在桌面小组件中显示你的近期日程。
        NSCalendarsUsageDescription: 用于在桌面小组件中显示你的近期日程。
        NSRemindersFullAccessUsageDescription: 用于在桌面小组件中显示已安排日期的提醒事项。
        NSRemindersUsageDescription: 用于在桌面小组件中显示已安排日期的提醒事项。
        CFBundleURLTypes:
          - CFBundleURLName: com.eyderoe.MonthAgenda
            CFBundleURLSchemes:
              - monthagenda
    dependencies:
      - target: MonthAgendaWidget
        embed: true
  MonthAgendaWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: MonthAgendaWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyderoe.MonthAgenda.MonthAgendaWidget
        PRODUCT_NAME: MonthAgendaWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 月历日程
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 用于在桌面小组件中显示你的近期日程。
        INFOPLIST_KEY_NSCalendarsUsageDescription: 用于在桌面小组件中显示你的近期日程。
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: 用于在桌面小组件中显示已安排日期的提醒事项。
        INFOPLIST_KEY_NSRemindersUsageDescription: 用于在桌面小组件中显示已安排日期的提醒事项。
        CODE_SIGN_ENTITLEMENTS: MonthAgendaWidget/MonthAgendaWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: YES
    info:
      path: MonthAgendaWidget/Info.plist
      properties:
        CFBundleDisplayName: 月历日程
        NSCalendarsFullAccessUsageDescription: 用于在桌面小组件中显示你的近期日程。
        NSCalendarsUsageDescription: 用于在桌面小组件中显示你的近期日程。
        NSRemindersFullAccessUsageDescription: 用于在桌面小组件中显示已安排日期的提醒事项。
        NSRemindersUsageDescription: 用于在桌面小组件中显示已安排日期的提醒事项。
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
